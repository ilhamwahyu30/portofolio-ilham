<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p4Grad)" rx="16"/>

  <!-- Creative agency layout -->
  <text x="60" y="80" font-family="sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="-1">LUMEN STUDIO — UI DESIGN SYSTEM</text>
  <text x="60" y="115" font-family="sans-serif" font-size="14" fill="#c084fc">Award-winning WebGL 3D design system &amp; component library</text>

  <!-- Component Cards -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="200" height="280" rx="16" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="100" cy="90" r="45" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,6"/>
    <circle cx="100" cy="90" r="25" fill="#a855f7"/>
    <text x="100" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Glassmorphism</text>
    <text x="100" y="210" font-family="sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Tokenized CSS System</text>
    <rect x="40" y="235" width="120" height="28" rx="14" fill="#7c3aed"/>
    <text x="100" y="253" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Explore Kit</text>
  </g>

  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="280" rx="16" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
    <polygon points="100,50 140,120 60,120" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <polygon points="100,70 125,115 75,115" fill="#06b6d4"/>
    <text x="100" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Micro-Interactions</text>
    <text x="100" y="210" font-family="sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Framer &amp; CSS Motion</text>
    <rect x="40" y="235" width="120" height="28" rx="14" fill="#06b6d4"/>
    <text x="100" y="253" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">View Demos</text>
  </g>

  <g transform="translate(540, 150)">
    <rect x="0" y="0" width="200" height="280" rx="16" fill="#1e1b4b" stroke="#ec4899" stroke-width="2"/>
    <rect x="65" y="60" width="70" height="70" rx="12" fill="none" stroke="#ec4899" stroke-width="3"/>
    <rect x="80" y="75" width="40" height="40" rx="6" fill="#ec4899"/>
    <text x="100" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Color Harmony</text>
    <text x="100" y="210" font-family="sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Accessible WCAG AAA</text>
    <rect x="40" y="235" width="120" height="28" rx="14" fill="#ec4899"/>
    <text x="100" y="253" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Palettes</text>
  </g>
</svg>
