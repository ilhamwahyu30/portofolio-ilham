<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" opacity="0.15" />
  <circle cx="200" cy="200" r="180" fill="#0f172a" stroke="url(#bgGrad)" stroke-width="4" />

  <!-- Abstract Tech Grid Lines -->
  <path d="M 60,200 H 340 M 200,60 V 340" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="200" cy="200" r="120" stroke="#334155" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Character Group -->
  <g filter="url(#shadow)">
    <!-- Clothing / Hoodies -->
    <path d="M 110,380 C 110,300 140,270 200,270 C 260,270 290,300 290,380 Z" fill="#1e293b" />
    <path d="M 145,285 L 200,340 L 255,285 Z" fill="#4f46e5" opacity="0.8"/>
    <path d="M 170,300 L 200,335 L 230,300 Z" fill="#0f172a"/>

    <!-- Neck -->
    <rect x="182" y="230" width="36" height="45" rx="8" fill="url(#skinGrad)"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#skinGrad)" />

    <!-- Modern Haircut -->
    <path d="M 138,175 C 135,115 170,100 200,100 C 240,100 265,118 262,175 C 255,145 240,135 200,135 C 160,135 145,150 138,175 Z" fill="#0f172a"/>
    <path d="M 135,170 C 130,135 155,110 190,105 C 235,100 268,125 265,165 C 250,128 220,120 185,125 C 150,130 140,150 135,170 Z" fill="#1e1e24"/>

    <!-- Stylish Glasses -->
    <rect x="155" y="165" width="38" height="28" rx="8" fill="none" stroke="#6366f1" stroke-width="4.5"/>
    <rect x="207" y="165" width="38" height="28" rx="8" fill="none" stroke="#6366f1" stroke-width="4.5"/>
    <path d="M 193,178 H 207" stroke="#6366f1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 140,175 H 155 M 245,175 H 260" stroke="#6366f1" stroke-width="3"/>

    <!-- Eyes (Behind Glasses) -->
    <circle cx="174" cy="179" r="4.5" fill="#1e293b"/>
    <circle cx="226" cy="179" r="4.5" fill="#1e293b"/>
    <circle cx="176" cy="177" r="1.5" fill="#ffffff"/>
    <circle cx="228" cy="177" r="1.5" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 158,157 Q 174,152 188,157" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 212,157 Q 226,152 242,157" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Nose & Confident Smile -->
    <path d="M 200,185 V 198 H 205" stroke="#fba779" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 183,212 Q 200,225 217,212" stroke="#e11d48" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing Floating Tech Badges -->
  <g transform="translate(60, 100)">
    <circle cx="20" cy="20" r="24" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="26" font-family="monospace" font-size="16" font-weight="bold" fill="#6366f1" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(300, 120)">
    <circle cx="20" cy="20" r="24" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="20" y="27" font-family="sans-serif" font-size="18" font-weight="bold" fill="#06b6d4" text-anchor="middle">⚡</text>
  </g>

  <g transform="translate(290, 270)">
    <rect x="0" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="14" cy="16" r="5" fill="#10b981"/>
    <text x="48" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">ONLINE</text>
  </g>
</svg>
