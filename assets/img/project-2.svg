<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p2Grad)" rx="16"/>

  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#1e293b" opacity="0.9"/>
  <circle cx="65" cy="55" r="14" fill="#6366f1"/>
  <text x="65" y="60" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">AI</text>
  <text x="95" y="60" font-family="sans-serif" font-weight="bold" font-size="16" fill="#fff">Synapse AI Studio</text>
  <rect x="580" y="42" width="160" height="26" rx="13" fill="#312e81"/>
  <text x="660" y="59" font-family="sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">⚡ GPT-4o Connected</text>

  <!-- Left: Prompt & Model Control -->
  <rect x="30" y="100" width="340" height="370" rx="12" fill="#1e293b"/>
  <text x="50" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Workflow Pipeline</text>
  <rect x="50" y="150" width="300" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="65" y="180" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Agent 1: Data Ingestion &amp; Scraping</text>
  <text x="65" y="200" font-family="monospace" font-size="11" fill="#94a3b8">Status: 24,000 docs vectorized</text>

  <line x1="200" y1="220" x2="200" y2="245" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="245" width="300" height="70" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="65" y="275" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Agent 2: Multi-Hop Reasoning</text>
  <text x="65" y="295" font-family="monospace" font-size="11" fill="#94a3b8">Latency: 140ms | Temp: 0.2</text>

  <line x1="200" y1="315" x2="200" y2="340" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4"/>

  <rect x="50" y="340" width="300" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="65" y="370" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">Agent 3: Automated Actions</text>
  <text x="65" y="390" font-family="monospace" font-size="11" fill="#94a3b8">Webhooks triggered: 14/14</text>

  <!-- Right: Realtime Output -->
  <rect x="390" y="100" width="380" height="370" rx="12" fill="#1e293b"/>
  <text x="415" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Live AI Interaction Stream</text>
  <rect x="415" y="150" width="330" height="70" rx="8" fill="#334155" opacity="0.6"/>
  <text x="430" y="175" font-family="sans-serif" font-size="11" fill="#e2e8f0">User: Generate high-conversion copy for SaaS landing</text>
  
  <rect x="415" y="235" width="330" height="150" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="430" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#818cf8">Synapse AI:</text>
  <text x="430" y="290" font-family="sans-serif" font-size="11" fill="#cbd5e1">"Transform complex workflows into intuitive</text>
  <text x="430" y="310" font-family="sans-serif" font-size="11" fill="#cbd5e1">AI-powered actions in seconds. Built for scale."</text>
  <rect x="430" y="335" width="80" height="24" rx="4" fill="#4f46e5"/>
  <text x="470" y="351" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">Deploy</text>
