<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#p3Grad)" rx="16"/>

  <!-- Left: Mobile phone mockup -->
  <g transform="translate(100, 40)">
    <rect x="0" y="0" width="220" height="420" rx="36" fill="#090d16" stroke="#10b981" stroke-width="3"/>
    <!-- Speaker notch -->
    <rect x="70" y="10" width="80" height="15" rx="7" fill="#1e293b"/>
    <!-- Balance Card -->
    <rect x="15" y="45" width="190" height="110" rx="16" fill="#047857"/>
    <text x="30" y="70" font-family="sans-serif" font-size="11" fill="#a7f3d0">Current Balance</text>
    <text x="30" y="105" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">$84,392.50</text>
    <text x="30" y="135" font-family="sans-serif" font-size="10" fill="#d1fae5">•••• 4892  |  VISA</text>

    <!-- Quick Actions -->
    <circle cx="45" cy="190" r="18" fill="#1e293b"/>
    <circle cx="95" cy="190" r="18" fill="#1e293b"/>
    <circle cx="145" cy="190" r="18" fill="#1e293b"/>
    <circle cx="190" cy="190" r="18" fill="#1e293b"/>

    <!-- Transactions list -->
    <rect x="15" y="230" width="190" height="45" rx="10" fill="#1e293b"/>
    <text x="25" y="250" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">Stripe Payout</text>
    <text x="25" y="265" font-family="sans-serif" font-size="9" fill="#94a3b8">Today, 10:45 AM</text>
    <text x="160" y="255" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">+$2,400</text>

    <rect x="15" y="285" width="190" height="45" rx="10" fill="#1e293b"/>
    <text x="25" y="305" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">AWS Cloud Infra</text>
    <text x="25" y="320" font-family="sans-serif" font-size="9" fill="#94a3b8">Yesterday</text>
    <text x="165" y="310" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">-$342</text>
  </g>

  <!-- Right: Web Analytics & Crypto Dashboard -->
  <g transform="translate(360, 40)">
    <rect x="0" y="0" width="380" height="420" rx="16" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="30" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">PayFlow Global Vault</text>
    <text x="30" y="60" font-family="sans-serif" font-size="11" fill="#94a3b8">Cross-border multi-currency payment infrastructure</text>

    <rect x="30" y="85" width="320" height="130" rx="12" fill="#1f2937"/>
    <text x="50" y="115" font-family="sans-serif" font-size="12" fill="#9ca3af">Monthly Volume</text>
    <text x="50" y="145" font-family="sans-serif" font-size="28" font-weight="bold" fill="#10b981">$2.4M USD</text>
    <path d="M 50,195 Q 120,160 180,185 T 320,140" fill="none" stroke="#10b981" stroke-width="3"/>

    <rect x="30" y="235" width="150" height="145" rx="12" fill="#1f2937"/>
    <text x="45" y="265" font-family="sans-serif" font-size="12" fill="#9ca3af">Security Score</text>
    <text x="45" y="310" font-family="sans-serif" font-size="32" font-weight="bold" fill="#38bdf8">99.9%</text>
    <text x="45" y="340" font-family="sans-serif" font-size="11" fill="#10b981">✓ SOC2 Type II</text>

    <rect x="200" y="235" width="150" height="145" rx="12" fill="#1f2937"/>
    <text x="215" y="265" font-family="sans-serif" font-size="12" fill="#9ca3af">Settlement Speed</text>
    <text x="215" y="310" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f59e0b">&lt; 2s</text>
    <text x="215" y="340" font-family="sans-serif" font-size="11" fill="#e2e8f0">Lightning Fast</text>
  </g>
</svg>
