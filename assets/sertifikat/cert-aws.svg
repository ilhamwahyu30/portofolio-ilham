<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Certificate Background -->
  <rect width="700" height="480" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="660" height="440" fill="#1e293b" rx="8" stroke="url(#goldBorder)" stroke-width="3"/>
  <rect x="30" y="30" width="640" height="420" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Seal / Badge -->
  <circle cx="350" cy="95" r="38" fill="#ff9900" opacity="0.15"/>
  <circle cx="350" cy="95" r="32" fill="#232f3e" stroke="#ff9900" stroke-width="2.5"/>
  <text x="350" y="102" font-family="sans-serif" font-weight="900" font-size="16" fill="#ff9900" text-anchor="middle">AWS</text>

  <text x="350" y="170" font-family="serif" font-size="14" letter-spacing="4" fill="#fbbf24" text-anchor="middle">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="350" y="200" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>
  <text x="350" y="235" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f8fafc" text-anchor="middle">Professional Software Engineer</text>
  <line x1="220" y1="248" x2="480" y2="248" stroke="#f59e0b" stroke-width="1.5"/>

  <text x="350" y="280" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">FOR SUCCESSFULLY DEMONSTRATING PROFICIENCY AS AN</text>
  <text x="350" y="310" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">AWS Certified Solutions Architect – Associate</text>
  <text x="350" y="335" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Validation of architectural expertise in high-availability, fault-tolerant cloud systems</text>

  <!-- Signatures & Details -->
  <g transform="translate(80, 380)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Issue Date: Oct 2025</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">ID: AWS-SA-9824107</text>
  </g>

  <g transform="translate(460, 380)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Amazon Web Services Training</text>
    <text x="80" y="32" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">VERIFIED CREDENTIAL ✓</text>
  </g>
</svg>
